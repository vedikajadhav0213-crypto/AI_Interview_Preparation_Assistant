{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="mb-4">📄 Upload Resume</h2>

        <form method="POST" enctype="multipart/form-data">

            <input
                type="file"
                name="resume"
                class="form-control mb-3"
                accept=".pdf,.doc,.docx"
                required>

            <button class="btn btn-primary">
                Upload Resume
            </button>

        </form>

    </div>

</div>

{% endblock %}
