<!DOCTYPE html>
<html>
<head>

<title>User Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
👤 My Profile
</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Username
</label>

<input
type="text"
name="username"
class="form-control"
value="{{ user.name }}"
required>

</div>

<div class="mb-3">

<label class="form-label">
Email
</label>

<input
type="email"
class="form-control"
value="{{ user.email }}"
readonly>

</div>

<button
class="btn btn-primary">

Update Profile

</button>

<a
href="{{ url_for('dashboard') }}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</body>
</html>
