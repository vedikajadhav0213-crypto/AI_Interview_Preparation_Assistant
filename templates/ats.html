<!DOCTYPE html>
<html>

<head>

<title>ATS Resume Analysis</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.box{
    width:700px;
    margin:auto;
    margin-top:40px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px lightgray;
}

h1{
    color:#2c3e50;
}

.score{
    font-size:32px;
    color:green;
    font-weight:bold;
}

h2{
    color:#34495e;
}

ul{
    font-size:18px;
    line-height:30px;
}

button{
    background:#3498db;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

</style>

</head>

<body>

<div class="box">

<h1>ATS Resume Analysis</h1>

<hr>

<h2 class="score">
ATS Score : {{ ats_score }}%
</h2>

<hr>

<h2>Resume Improvement Suggestions</h2>

<ul>
{% for suggestion in suggestions %}
    <li>{{ suggestion }}</li>
{% endfor %}
</ul>

<hr>

<h2>Missing Skills</h2>

<ul>
{% for skill in missing_skills %}
    <li>{{ skill }}</li>
{% endfor %}
</ul>

<br>

<a href="{{ url_for('dashboard') }}">
    <button>Back to Dashboard</button>
</a>

</div>

</body>

</html>
